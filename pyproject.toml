[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "minishop-corp"
version = "0.1.0"
description = "Corporate contracts plugin for Remnawave Minishop"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.entry-points."minishop.plugins"]
minishop-corp = "minishop_corp:plugin"

[tool.hatch.build.targets.wheel]
packages = ["backend/minishop_corp"]

[tool.hatch.build.targets.wheel.force-include]
locales = "minishop_corp/locales"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --basetemp=.local/pytest"
cache_dir = ".local/pytest-cache"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
files = ["backend"]
strict = true
follow_imports = "silent"
cache_dir = ".local/mypy"
