name: minishop-corp-dev

x-runtime: &runtime
  build:
    context: ../.local/build-context
    dockerfile: ../../dev/Dockerfile
    target: runtime
  image: minishop-corp-dev-runtime:local
  user: "${CORP_UID:?}:${CORP_GID:?}"
  read_only: true
  working_dir: /runtime
  volumes:
    - ${MINISHOP_SOURCE:?Run through scripts/stand.sh}:/minishop:ro
    - ../.local/runtime:/runtime
    - ../.local/package:/package:ro
    - ../dev:/corp-dev:ro
  environment: &environment
    TELEGRAM_ENABLED: "false"
    TELEMETRY_ENABLED: "false"
    PLUGINS_ENABLED: "true"
    PLUGINS_STRICT: "true"
    POSTGRES_HOST: postgres
    POSTGRES_USER: corp_dev
    POSTGRES_PASSWORD: local-development-only
    POSTGRES_DB: corp_dev
    REDIS_URL: redis://redis:6379/0
    REDIS_KEY_PREFIX: minishop-corp-dev
    WEBAPP_ENABLED: "true"
    WEBAPP_SESSION_SECRET: local-development-session-secret-never-use-in-production
    WEBHOOK_SECRET_TOKEN: local-development-webhook-secret
    WEB_SERVER_PORT: "8080"
    WEBAPP_SERVER_PORT: "8081"
    PANEL_WRITE_MODE: dry-run
    BACKUP_ENABLED: "false"
    AUTO_RENEW_RETRY_ENABLED: "false"
    AUTO_RENEW_SCHEDULER_ENABLED: "false"
    SUBSCRIPTION_NOTIFICATIONS_ENABLED: "false"
    SUBSCRIPTION_PAGE_CONFIG_PATH: /runtime/data/subscription-config.json
    TARIFFS_CONFIG_PATH: /runtime/data/tariffs.json
    MINISHOP_PLUGIN_STORE: /runtime/data/plugin-store
    MINISHOP_BUNDLED_PLUGIN_ARCHIVE: /package/minishop-corp-dev.zip
    MINISHOP_BUNDLED_PLUGIN_PUBLIC_KEY: /package/development.pub
    TMPDIR: /runtime/tmp
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  integration:
    profiles: [tests]
    build:
      context: ../.local/build-context
      dockerfile: ../../dev/Dockerfile
      target: integration
    image: minishop-corp-integration:local
    user: "${CORP_UID:?}:${CORP_GID:?}"
    read_only: true
    working_dir: /workspace
    volumes:
      - ..:/workspace:ro
      - ../.local/integration:/workspace/.local
      - ${MINISHOP_SOURCE:?}:/minishop:ro
    environment:
      CORP_INTEGRATION: "1"
      POSTGRES_HOST: postgres
      POSTGRES_USER: corp_dev
      POSTGRES_PASSWORD: local-development-only
      TELEGRAM_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      ADVERTISING_ENABLED: "false"
      PLUGINS_ENABLED: "false"
      PANEL_API_URL: ""
      PANEL_WRITE_MODE: dry-run
      WEBAPP_THEMES_DIR: /workspace/.local/themes
      PYTHONPATH: /workspace/backend:/minishop/backend
      PYTHONDONTWRITEBYTECODE: "1"
      MINISHOP_PLUGIN_STORE: /workspace/.local/plugin-store
      TMPDIR: /workspace/.local/tmp
    command: ["python", "-m", "pytest", "tests/integration", "-q"]
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: corp_dev
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: corp_dev
    volumes:
      - ../.local/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corp_dev -d corp_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    volumes:
      - ../.local/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    <<: *runtime
    command: ["python", "/minishop/backend/plugin_launcher.py", "backend"]
    ports:
      - "127.0.0.1:${CORP_WEBAPP_PORT:-18081}:8081"
  worker:
    <<: *runtime
    command: ["python", "/minishop/backend/plugin_launcher.py", "worker"]
  preview:
    image: minishop-corp-dev-runtime:local
    user: "${CORP_UID:?}:${CORP_GID:?}"
    read_only: true
    volumes:
      - ..:/workspace:ro
    command: ["python", "/workspace/dev/preview.py"]
    environment:
      CORP_BACKEND_ORIGIN: http://backend:8081
      CORP_PREVIEW_HOST: "0.0.0.0"
      CORP_PREVIEW_PORT: "8082"
    ports:
      - "127.0.0.1:${CORP_PREVIEW_PORT:-18082}:8082"
    depends_on:
      - backend
