name: minishop-corp-package

services:
  backend:
    extends:
      file: compose.yaml
      service: backend
    ports: !reset []
    volumes:
      - ../.local/package-check/${CORP_PACKAGE_RUN:?}/runtime:/runtime
      - ../.local/package-check/${CORP_PACKAGE_RUN:?}:/acceptance:ro
    environment:
      MINISHOP_BUNDLED_PLUGIN_ARCHIVE: ""
      MINISHOP_BUNDLED_PLUGIN_PUBLIC_KEY: ""
  worker:
    extends:
      file: compose.yaml
      service: worker
    volumes:
      - ../.local/package-check/${CORP_PACKAGE_RUN:?}/runtime:/runtime
      - ../.local/package-check/${CORP_PACKAGE_RUN:?}:/acceptance:ro
    environment:
      MINISHOP_BUNDLED_PLUGIN_ARCHIVE: ""
      MINISHOP_BUNDLED_PLUGIN_PUBLIC_KEY: ""
  postgres:
    extends:
      file: compose.yaml
      service: postgres
    volumes:
      - ../.local/package-check/${CORP_PACKAGE_RUN:?}/postgres:/var/lib/postgresql/data
  redis:
    extends:
      file: compose.yaml
      service: redis
    volumes:
      - ../.local/package-check/${CORP_PACKAGE_RUN:?}/redis:/data
