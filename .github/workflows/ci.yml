name: Plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MINISHOP_SOURCE: ${{ github.workspace }}/.local/minishop
      KIRO_WHEEL_SOURCE: ${{ github.workspace }}/.local/kiro-wheel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: false
      - name: Fetch pinned Minishop inside the workspace
        run: bash scripts/fetch-minishop.sh
      - name: Fetch pinned example plugin inside the workspace
        run: bash scripts/fetch-kiro-wheel.sh
      - name: Install locked development dependencies
        run: bash scripts/setup.sh
      - name: Lint, typecheck, test and build
        run: bash scripts/check.sh
      - name: Entitlement contracts against native Minishop and PostgreSQL
        run: bash scripts/integration-check.sh
      - name: Validate package lifecycle with a disposable CI publisher key
        run: |
          bash scripts/package.sh init-key
          bash scripts/package-check.sh
      - name: Start isolated host and validate installed plugin
        run: |
          bash scripts/stand.sh up
          bash scripts/stand.sh check
          bash scripts/browser-check.sh
      - name: Host logs
        if: always()
        run: bash scripts/stand.sh logs --no-color --tail=100 backend worker
      - name: Stop only the plugin development stack
        if: always()
        run: bash scripts/stand.sh down
