name: Signed plugin package
on:
  push:
    branches:
      - "**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install packaging dependencies
        run: |
          python -m pip install --no-cache-dir -r requirements-build.txt
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Build plugin frontend
        run: npm run build
      - name: Sign installable plugin package
        env:
          MINISHOP_CORP_SIGNING_KEY: ${{ secrets.MINISHOP_CORP_SIGNING_KEY }}
        run: python scripts/build-package.py build --key-env MINISHOP_CORP_SIGNING_KEY
      - name: Save installable package and publisher information
        uses: actions/upload-artifact@v4
        with:
          name: minishop-corp-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Show installation information
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          index = json.loads(Path("dist/release/minishop-plugin.json").read_text())
          print("Download this run's artifact and extract it.")
          print(f"Upload **{index['artifact']}** in Minishop → Plugins.")
          print(f"\nPlugin version: `{index['version']}`")
          print(f"\nPackage SHA-256: `{index['sha256']}`")
          print("\nThe outer GitHub artifact ZIP is not the installable plugin ZIP.")
          PY
